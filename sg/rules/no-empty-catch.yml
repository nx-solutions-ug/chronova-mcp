id: no-empty-catch
language: typescript
message: 'Empty catch blocks silently swallow errors, making debugging impossible.

  At minimum, log the error or explicitly ignore it with a comment.

  '
severity: error
note: 'An empty catch turns a failure into silence, which is the hardest kind of bug

  to find. Log it, return a fallback, rethrow, or write a comment saying which

  error is being ignored and why.

  '
ignores:
- tests/**
rule:
  kind: catch_clause
  not:
    any:
    - has:
        kind: statement_block
        has:
          kind: expression_statement
    - has:
        kind: statement_block
        has:
          kind: return_statement
    - has:
        kind: statement_block
        has:
          kind: throw_statement
    - has:
        kind: statement_block
        has:
          kind: if_statement
